      <stop offset="1" stop-color="#0b2149"/>
    </linearGradient>
    <filter id="softShadow" x="-15%" y="-15%" width="130%" height="145%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#142e5c" flood-opacity="0.10"/>
    </filter>
    <style>text { font-family: Inter, "Segoe UI", Arial, sans-serif; }</style>
  </defs>

